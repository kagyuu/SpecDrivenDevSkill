# P302 (docs/P302-deliver.md 実行前チェック item 7): the frontend's API
# calls (client/src/api/*.ts) are all *relative* fetches, e.g.
# fetch('/api/reservations', { credentials: 'include' }) - there is no
# BASE_URL / cross-origin config anywhere in the client. That is a hard
# same-origin assumption, confirmed by grepping every client/src/api/*.ts
# file for `fetch(`.
#
# This nginx config is what makes the docker-compose topology satisfy that
# assumption *without* changing any client or server source: it serves the
# built SPA (client/dist, this container's own files) and the backend API
# from the SAME origin (this container's own port), by reverse-proxying
# /api/ through to the "server" service on the compose network. The
# browser only ever talks to this one origin.
#
# auth cookies (server/app/routers/auth.py: httponly, samesite=lax) are
# therefore set by a request that the browser sees as same-origin, so no
# CORS or cross-site-cookie configuration is needed either.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy every /api/* call straight through to the backend
    # container. "server" is the docker-compose service name (see
    # docker-compose.yml) - resolved via Docker's embedded DNS, not
    # localhost, since these are separate containers.
    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reservation cookies must round-trip unmodified between the
        # browser and the backend for the login session to work.
        proxy_pass_request_headers on;
    }

    # client-side routing (react-router-dom, client/src/App.tsx): any path
    # that isn't a real static file falls back to index.html so deep links
    # (e.g. /reservations/42) don't 404 on a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
