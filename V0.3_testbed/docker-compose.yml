services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_DB_PATH=/app/server/data/app.db
    volumes:
      - app-data:/app/server/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app-data:
