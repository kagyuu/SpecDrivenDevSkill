[project]
name = "meeting-room-reservation-server"
version = "1.1.0"
description = "Meeting room reservation system - backend (FastAPI, sqlite3)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "bcrypt>=4.1",
    "httpx>=0.27",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]
