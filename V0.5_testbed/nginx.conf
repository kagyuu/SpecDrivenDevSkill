# nginx.conf — client(静的配信)とserver(API)を単一オリジンに統合するリバースプロキシ設定
#
# ★P302作成★ client/js/api/*.js は `BASE_URL = ""` を前提に `/api/...` への相対パスでfetchしている
# (docs/test-records/20260803-1930-test-record.md の分析参照、P302で判明した配布トポロジー上の必須事項)。
# client・serverを別コンテナ・別ポートで単純に立てただけでは、ブラウザがclientのオリジンに対して
# `/api/...` を要求してしまい正しく動作しない。本設定は両者を単一オリジン(このnginx)に統合する。
#
# 本サンドボックスにはDockerデーモンがなく、この設定を実際に `docker compose up` して動作確認することは
# できていない(server/Dockerfileと同様、未検証)。

server {
    listen 80;

    location /api/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://client:8080;
        proxy_set_header Host $host;
    }
}
