# client/nginx.conf
#
# ※docs/P302-deliver.md 実行前チェック項目7にもとづき追加。
# client/src/api/client.ts の apiFetch は `VITE_API_BASE_URL` が未設定の場合、相対パス
# (`/api/...`)でfetchする(クロスオリジンの絶対URLは使わない)。また `credentials: "include"`
# でCookieセッション(ADR-005、SameSite=Lax)を送出する設計になっている。SameSite=Laxの
# Cookieはクロスサイトのfetch/XHRには送出されない仕様のため、フロントエンド(静的配信)と
# バックエンド(APIサーバー)を別オリジンのまま配布すると認証が機能しない
# (docs/P103実施時に開発環境で同じ問題を確認済み、client/vite.config.tsのプロキシ設定コメント参照)。
# 本番相当のdocker-compose構成でも同じ前提が成り立つよう、このnginxが静的ファイル配信と
# /api/* のリバースプロキシを1つのオリジンに統合する。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPAのクライアントサイドルーティング(react-router-dom)に対応する。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # バックエンド(FastAPI)へのリバースプロキシ。docker-compose上のサービス名 "server" を参照する。
    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
